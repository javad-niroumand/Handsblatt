@keyframes pr{0%{transform:scale(1);opacity:.6;}100%{transform:scale(1.5);opacity:0;}}

.pr:nth-child(2){animation-delay:.6s;}
#wc{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);width:280px;}

<script>
let ac=null;
function unlockAudio(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();}
function playSound(){
  try{
    unlockAudio();
    [0,500].forEach(d=>{
      setTimeout(()=>{
        const o=ac.createOscillator(),g=ac.createGain();
        o.connect(g);g.connect(ac.destination);
        o.type='sine';
        o.frequency.setValueAtTime(880,ac.currentTime);
        o.frequency.setValueAtTime(1100,ac.currentTime+.1);
        o.frequency.setValueAtTime(880,ac.currentTime+.2);
        g.gain.setValueAtTime(0,ac.currentTime);
        g.gain.linearRampToValueAtTime(.35,ac.currentTime+.05);
        g.gain.setValueAtTime(.35,ac.currentTime+.25);
        g.gain.linearRampToValueAtTime(0,ac.currentTime+.38);
        o.start(ac.currentTime);o.stop(ac.currentTime+.4);
      },d);
    });
  }catch(e){}
}
function updateClock(){
  const n=new Date(),h=String(n.getHours()).padStart(2,'0'),m=String(n.getMinutes()).padStart(2,'0');
  document.getElementById('clk').textContent=h+':'+m;
  const tl=document.getElementById('timeLine');
  if(tl) tl.textContent=h+':'+m;
}
function updateDate(){
  const days=['So','Mo','Di','Mi','Do','Fr','Sa'];
  const months=['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sept.','Okt.','Nov.','Dez.'];
  const n=new Date();
  const dl=document.getElementById('dateLine');
  if(dl) dl.textContent=days[n.getDay()]+'. '+n.getDate()+'. '+months[n.getMonth()];
}
updateClock();updateDate();setInterval(updateClock,30000);
['click','touchstart','mousemove'].forEach(e=>document.addEventListener(e,unlockAudio,{once:true}));
setTimeout(()=>{
  const n=new Date(),h=String(n.getHours()).padStart(2,'0'),m=String(n.getMinutes()).padStart(2,'0');
  document.getElementById('ntm').textContent=h+':'+m;
  document.getElementById('nb').classList.add('show');
  playSound();
},10000);
function decline(){
  const b=document.getElementById('nb');
  b.style.transition='all .4s ease';b.style.transform='translateY(-130px)';b.style.opacity='0';
  setTimeout(()=>{b.classList.remove('show');b.style.transform='';b.style.opacity='';b.style.transition='';},420);
}
function accept(){
  decline();
  setTimeout(()=>{document.getElementById('co').classList.add('active');initRTC();},450);
}
function endCall(){
  document.getElementById('co').classList.remove('active');
  document.getElementById('cst').textContent='Verbinden…';
  document.getElementById('wc').innerHTML='';
}
function initRTC(){
  const s=document.getElementById('cst');s.textContent='Verbinden…';
  const c=document.getElementById('wc');c.innerHTML='';
  const sc=document.createElement('script');
  sc.src='https://github.com/Cognigy/click-to-call-widget/releases/latest/download/webRTCWidget.js';
  sc.onload=()=>{
    if(window.initWebRTCWidget){
      window.initWebRTCWidget('https://endpoint-trial.cognigy.ai/1be5f8491b178623c5876c012b9f180a557505ce7658fb8db55d947fa1ce70ea')
      .then(w=>{
        s.textContent='Verbunden';
        w.on('newRTCSession',sess=>{
          sess.on('newInfo',ev=>{try{const d=JSON.parse(ev.request.body);console.log('SIM:',d);}catch(e){}});
        });
      }).catch(()=>{s.textContent='Verbindung fehlgeschlagen';});
    }
  };
  sc.onerror=()=>{s.textContent='Widget nicht geladen';};
  document.head.appendChild(sc);
}
</script>
