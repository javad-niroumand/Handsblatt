<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVA</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#000;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:2rem 0;position:relative;}
#cognigy-prison{position:fixed;top:0;left:-9999px;width:260px;height:200px;pointer-events:none;z-index:1;opacity:0;}
.shell{width:375px;height:812px;background:#000;border-radius:52px;box-shadow:0 0 0 2px #3a3a3c,0 0 0 5px #1c1c1e,0 30px 80px rgba(0,0,0,.6);position:relative;overflow:hidden;flex-shrink:0;z-index:10;}
.screen{position:absolute;inset:0;border-radius:52px;overflow:hidden;display:flex;flex-direction:column;}
.wp{position:absolute;inset:0;background:url('iClarified-iOS27-Celosia-Color-LockScreen.jpeg') center/cover no-repeat;z-index:0;}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:34px;background:#000;border-radius:0 0 22px 22px;z-index:50;}
.sb{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 24px 4px;color:#fff;font-size:15px;font-weight:600;font-family:-apple-system,sans-serif;}
.sb-r{display:flex;align-items:center;gap:6px;}
.bars-sb{display:flex;align-items:flex-end;gap:2px;}
.bar-sb{width:3px;background:#fff;border-radius:1px;}
.hc{position:relative;z-index:5;flex:1;display:flex;flex-direction:column;padding:0 0 20px;}
.dw{text-align:center;padding:26px 0 10px;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;}
.dd{font-size:29px;font-weight:600;letter-spacing:.1px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3);margin-bottom:4px;}
.dn{font-size:108px;font-weight:600;line-height:1;letter-spacing:-2px;color:transparent;
  background-image:linear-gradient(135deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,.3) 10%,rgba(255,255,255,.08) 28%,rgba(255,255,255,.4) 52%,rgba(255,255,255,.1) 100%),url('iClarified-iOS27-Celosia-Color-LockScreen.jpeg');
  background-size:375px 814.75px,375px 814.75px;background-repeat:no-repeat;background-position:0 0,0 -104.375px;
  -webkit-background-clip:text;background-clip:text;-webkit-text-stroke:0.6px rgba(255,255,255,.55);
  filter:brightness(1.8) saturate(1.5) contrast(1.15) blur(0.4px);text-shadow:0 3px 8px rgba(0,0,0,.45);}
.grid{display:grid;grid-template-columns:repeat(4,1fr);align-content:start;gap:18px 10px;padding:16px 22px;flex:1;}
.ai{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;}
.ic{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.al{font-size:11px;color:#fff;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.6);font-weight:400;font-family:-apple-system,sans-serif;}
.dock{background:rgba(255,255,255,.15);backdrop-filter:blur(20px);border-radius:26px;margin:0 16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;}
.di{width:62px;height:62px;border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;}
.hi{width:134px;height:5px;background:rgba(255,255,255,.35);border-radius:3px;margin:8px auto 0;display:block;}

/* ── Notification banner ── */
#nb{position:absolute;top:50px;left:16px;right:16px;z-index:200;border-radius:20px;background:rgba(28,28,30,.92);backdrop-filter:blur(30px);padding:14px 16px;transform:translateY(-160px);opacity:0;transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .55s ease;pointer-events:none;font-family:-apple-system,sans-serif;}
#nb.show{transform:translateY(0);opacity:1;pointer-events:all;}
.nt{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.nai{width:32px;height:32px;border-radius:8px;background:#451DC7;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nai i{font-size:17px;color:#fff;}
.nan{font-size:12px;color:rgba(255,255,255,.55);font-weight:500;letter-spacing:.3px;text-transform:uppercase;}
.ntm{font-size:12px;color:rgba(255,255,255,.4);margin-left:auto;}
.ntit{font-size:16px;font-weight:600;color:#fff;margin-bottom:3px;}
.nbod{font-size:14px;color:rgba(255,255,255,.7);line-height:1.4;}
.nact{display:flex;gap:8px;margin-top:12px;}
#btn-annehmen{flex:1;padding:10px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:-apple-system,sans-serif;background:#34c759;color:#fff;position:relative;z-index:5;}
#btn-ablehnen{flex:1;padding:10px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:-apple-system,sans-serif;background:rgba(255,255,255,.12);color:#fff;}

/* ── Call screen ── */
#co{position:absolute;inset:0;z-index:300;background:#000;display:none;flex-direction:column;border-radius:52px;font-family:-apple-system,sans-serif;overflow:hidden;}
#co.active{display:flex;}

/* Default call view */
#co-default{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:70px 30px 55px;width:100%;height:100%;}
.caller-name{font-size:32px;font-weight:400;color:#fff;letter-spacing:-.5px;margin-bottom:6px;text-align:center;}
.caller-status{font-size:15px;color:rgba(255,255,255,.6);font-weight:400;letter-spacing:0.5px;text-align:center;}
#sphere-canvas{display:block;border-radius:50%;}

/* Scene call view */
#co-scene{display:none;flex-direction:column;width:100%;height:100%;padding:56px 22px 34px;}
#co-scene.active{display:flex;}

.scene-caller-head{text-align:center;flex-shrink:0;}
.scene-caller-name{font-size:26px;font-weight:400;color:#fff;letter-spacing:-.3px;margin-bottom:4px;}
.scene-caller-status{font-size:14px;color:rgba(255,255,255,.6);font-weight:400;letter-spacing:0.3px;}

.sphere-zone{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;}

/* Action feed */
.action-feed{flex-shrink:0;display:flex;flex-direction:column;gap:10px;}
.feed-header{display:flex;align-items:center;justify-content:space-between;height:40px;flex-shrink:0;}
.feed-side{display:flex;align-items:center;gap:8px;transition:opacity .3s ease;}
.feed-side.dim{opacity:.4;}
.feed-side-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:700;color:#fff;background:#3a3a3c;transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .4s ease,background .3s ease;}
.feed-side-icon i{font-size:15px;}
.feed-side-icon.active{box-shadow:0 0 0 3px rgba(124,140,255,.35);}
.feed-side-label{font-size:12px;color:#a8a8ac;font-weight:500;}
.feed-exchange{flex:1;display:flex;justify-content:center;align-items:center;padding:0 10px;min-width:0;}
.feed-exchange-track{position:relative;width:100%;height:2px;background:repeating-linear-gradient(90deg,#3a3a3c 0 5px,transparent 5px 10px);border-radius:1px;}
.feed-exchange-dot{position:absolute;top:50%;left:0;width:10px;height:10px;border-radius:50%;background:#4fd68f;transform:translate(0,-50%);opacity:0;box-shadow:0 0 8px 1px rgba(79,214,143,.6);}
.feed-exchange-dot.running{opacity:1;animation:exchangeMove 2.2s ease-in-out infinite;}
@keyframes exchangeMove{0%{left:0;transform:translate(0,-50%);}50%{left:100%;transform:translate(-100%,-50%);}100%{left:0;transform:translate(0,-50%);}}
.feed-divider{height:1px;background:#2a2a2e;flex-shrink:0;}
.feed-steps{display:flex;flex-direction:column;gap:7px;min-height:112px;}
.feed-step{display:flex;align-items:flex-start;gap:8px;transition:opacity .25s ease;}
.feed-step i{font-size:13px;flex-shrink:0;margin-top:1px;}
.feed-step.done i{color:#4fd68f;}
.feed-step.current i{color:#7c8cff;}
.feed-step.fail i{color:#8e8e93;}
.feed-step.warn i{color:#f0a830;}
.feed-step-text{font-size:13px;line-height:1.4;}
.feed-step.done .feed-step-text{color:#8e8e93;}
.feed-step.current .feed-step-text{color:#e5e5ea;font-weight:500;}
.feed-step.fail .feed-step-text{color:#a8a8ac;}
.feed-step.warn .feed-step-text{color:#e5c88f;}
.feed-step.a2a .feed-step-text::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:#4fd68f;margin-right:2px;vertical-align:1px;}

/* Shared call controls */
.cac{display:flex;justify-content:space-around;width:100%;align-items:center;flex-shrink:0;}
.cbw{text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;}
.cbi{border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .15s, background-color .2s ease;}
.cbi:active{transform:scale(.92);}
.cbi i{color:#fff;}
.cbr{background:#ff3b30;}
.cbg{background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);}
.cbl{font-size:11px;color:rgba(255,255,255,.6);font-weight:400;}

/* Default view controls (64px) */
#co-default .cbi{width:64px;height:64px;}
#co-default .cbi i{font-size:26px;}
#co-default .cbl{font-size:12px;color:rgba(255,255,255,.65);}
#co-default .cac{margin-top:0;}

/* Scene view controls (52px) */
#co-scene .cbi{width:52px;height:52px;}
#co-scene .cbi i{font-size:21px;}
#co-scene .cac{margin-top:14px;}

/* Overlay (carousel / approval) */
#overlayLayer{position:absolute;inset:0;z-index:400;pointer-events:none;}
#overlayLayer:not(:empty){pointer-events:all;}

/* Carousel */
.carousel-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;flex-direction:column;justify-content:flex-end;padding:0 0 30px;}
.carousel-box{background:#0a0a0c;border-top:0.5px solid #2a2a2e;padding:16px 0 8px;}
.carousel-title{text-align:center;font-size:12px;color:#8e8e93;margin-bottom:10px;}
.track-wrap{overflow:hidden;padding:0 18px;}
.track{display:flex;transition:transform .4s cubic-bezier(.4,0,.2,1);}
.offer-card{flex:0 0 100%;padding-right:10px;box-sizing:border-box;}
.offer-inner{background:#1c1c1e;border-radius:16px;padding:14px;position:relative;}
.offer-inner.rec{border:1.5px solid #4fd68f;}
.offer-badge{position:absolute;top:-9px;left:14px;background:#4fd68f;color:#04342c;font-size:9px;font-weight:600;padding:2px 8px;border-radius:20px;}
.offer-title{font-size:13px;font-weight:600;color:#fff;margin:4px 0 1px;}
.offer-sub{font-size:10px;color:#8e8e93;margin-bottom:10px;}
.offer-row{display:flex;justify-content:space-between;margin-bottom:5px;}
.offer-row span{font-size:10px;}
.offer-row span:first-child{color:#8e8e93;}
.offer-row span:last-child{color:#e5e5ea;}
.dots{display:flex;justify-content:center;gap:5px;margin-top:10px;}
.dot{width:5px;height:5px;border-radius:50%;background:#3a3a3c;}
.dot.active{background:#fff;}

/* Approval */
.approval-overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:0 20px;}
.approval-card{background:#1c1c1e;border-radius:18px;padding:18px;width:100%;border:0.5px solid #3a3a3c;}
.approval-title{font-size:14px;font-weight:600;color:#fff;margin-bottom:12px;}
.approval-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid #2a2a2e;}
.approval-row:last-of-type{border-bottom:none;}
.approval-row i{font-size:14px;flex-shrink:0;}
.approval-row.ok i{color:#4fd68f;}
.approval-row.manual i{color:#8e8e93;}
.approval-text{font-size:11px;color:#e5e5ea;}
.approval-btn{margin-top:14px;width:100%;padding:11px;border-radius:12px;border:none;background:#34c759;color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>

<div id="cognigy-prison"></div>

<div class="shell" id="myShell">
  <div class="notch"></div>
  <div class="screen">
    <!-- Wallpaper + home screen -->
    <div class="wp"></div>
    <div class="sb">
      <span id="clk">9:41</span>
      <div class="sb-r">
        <div class="bars-sb">
          <div class="bar-sb" style="height:4px"></div>
          <div class="bar-sb" style="height:7px"></div>

          <div class="bar-sb" style="height:13px"></div>
        </div>

      <div class="dw">
        <div class="dd" id="dateLine">Fr. 4. Sept.</div>
        <div class="dn" id="timeLine">17:37</div>
      </div>
      <div class="grid">
        <div class="ai"><div class="ic" style="overflow:hidden;"><img src="linkedin-app-icon.webp" style="width:100%;height:100%;object-fit:cover;border-radius:14px;"></div><span class="al">LinkedIn</span></div>
        <div class="ai"><div class="ic" style="overflow:hidden;"><img src="wavestone-logo-cropped.png" style="width:100%;height:100%;object-fit:cover;border-radius:14px;"></div><span class="al">Wavestone</span></div>
        <div class="ai"><div class="ic" style="overflow:hidden;"><img src="App_Store_(iOS).svg.webp" style="width:100%;height:100%;object-fit:cover;border-radius:14px;"></div><span class="al">App Store</span></div>
        <div class="ai"><div class="ic" style="background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;"><img src="microsoft-outlook-icon.webp" style="width:76%;height:76%;object-fit:contain;"></div><span class="al">Outlook</span></div>
        <div class="ai"><div class="ic" style="overflow:hidden;"><img src="tiktok-rounded-square-icon.webp" style="width:100%;height:100%;object-fit:cover;border-radius:14px;"></div><span class="al">TikTok</span></div>
        <div class="ai"><div class="ic" style="overflow:hidden;"><img src="netflix-icon.webp" style="width:100%;height:100%;object-fit:cover;border-radius:14px;"></div><span class="al">Netflix</span></div>
        <div class="ai"><div class="ic" style="overflow:hidden;"><img src="youtube-square-cropped.png" style="width:100%;height:100%;object-fit:cover;border-radius:14px;"></div><span class="al">YouTube</span></div>
        <div class="ai"><div class="ic" style="overflow:hidden;"><img src="apple-music-icon.webp" style="width:100%;height:100%;object-fit:cover;border-radius:14px;"></div><span class="al">Music</span></div>
        <div class="ai"><div class="ic" style="overflow:hidden;"><img src="spotify-icon-png-15382.png" style="width:100%;height:100%;object-fit:cover;border-radius:14px;"></div><span class="al">Spotify</span></div>
        <div class="ai"><div class="ic" style="overflow:hidden;"><img src="wa-whatsapp-icon.webp" style="width:100%;height:100%;object-fit:cover;border-radius:14px;"></div><span class="al">WhatsApp</span></div>
        <div class="ai"><div class="ic" style="overflow:hidden;"><img src="Instagram_logo_2022.svg.webp" style="width:100%;height:100%;object-fit:cover;border-radius:14px;"></div><span class="al">Instagram</span></div>
      </div>
      <div class="dock">
        <div class="di"><img src="Phone_iOS.png" style="width:100%;height:100%;object-fit:cover;border-radius:16px;transform:scale(1.18);"></div>
        <div class="di"><img src="Apple_Calendar_(iOS).svg.webp" style="width:100%;height:100%;object-fit:cover;border-radius:16px;"></div>
        <div class="di"><img src="Contacts_(iOS).png" style="width:100%;height:100%;object-fit:cover;border-radius:16px;"></div>
        <div class="di" style="background:#fff;"><img src="google-chrome-icon.webp" style="width:84%;height:84%;object-fit:contain;"></div>

    </div>

    <!-- Notification banner -->
    <div id="nb">
      <div class="nt">

        <span class="ntm" id="ntm">gerade eben</span>

    <!-- Call screen (full overlay) -->
    <div id="co">

      <!-- Overlay for carousel / approval -->
      <div id="overlayLayer"></div>

    </div>
  </div>
</div>

<script src="https://github.com/Cognigy/click-to-call-widget/releases/latest/download/webRTCWidget.js"></script>
<script>
/* ───────────────────────────────────────────────
   STATE
─────────────────────────────────────────────── */
var audioCtx      = null;
var animFrame     = null;
var muted         = false;
var cognigyBtn    = null;
var widgetRef     = null;
var transcriptObs = null;
var sphereRunning = false;
var time          = 0;
var callActive    = false;
var notifTimer    = null;

var speaking   = false;
var targetE    = 0;
var smoothE    = 0;
var speakTimer = null;
var lastText   = '';

var sphereColorMode = 'default'; // 'default', 'success', 'warning'

var sceneTimers = [];
var scenes = [];

var sc    = document.getElementById('sphere-canvas');
var ctx2d = sc.getContext('2d');
var CX = 105, CY = 105, R = 86;

function activateScene(idx) {
  console.log('Activating scene:', idx);
}

function clearSceneTimers() {
  sceneTimers.forEach(clearTimeout);
  sceneTimers = [];
}

/* ───────────────────────────────────────────────
   CLOCK
─────────────────────────────────────────────── */
function updateClock() {
  var now = new Date();
  var h = String(now.getHours()).padStart(2,'0');
  var m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clk').textContent = h + ':' + m;
  var t = document.getElementById('timeLine');
  if (t) t.textContent = h + ':' + m;
}

function updateDate() {
  var D = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  var M = ['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sept.','Okt.','Nov.','Dez.'];
  var now = new Date();
  var d = document.getElementById('dateLine');
  if (d) d.textContent = D[now.getDay()] + '. ' + now.getDate() + '. ' + M[now.getMonth()];
}

function schedClock() {
  updateClock();
  var now = new Date();
  setTimeout(schedClock, (60 - now.getSeconds()) * 1000 - now.getMilliseconds());
}
schedClock();
updateDate();

/* ───────────────────────────────────────────────
   AUDIO
─────────────────────────────────────────────── */
function unlockAudio() {
  if (audioCtx) { audioCtx.resume(); return; }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

['click','touchstart','mousemove'].forEach(function(e) {
  document.addEventListener(e, unlockAudio, { once: true });
});

function playNotifSound() {
  try {
    unlockAudio();
    var notes = [{f:1047,s:0,d:.12},{f:1319,s:.14,d:.12},{f:1568,s:.28,d:.18},
                 {f:1047,s:.55,d:.12},{f:1319,s:.69,d:.12},{f:1568,s:.83,d:.18}];
    notes.forEach(function(n) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination); o.type = 'sine';
      var t = audioCtx.currentTime + n.s;
      o.frequency.setValueAtTime(n.f, t);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.28, t + .02);
      g.gain.setValueAtTime(.28, t + n.d - .04);
      g.gain.linearRampToValueAtTime(0, t + n.d);
      o.start(t); o.stop(t + n.d + .01);
    });
  } catch(e) {}
}

/* ───────────────────────────────────────────────
   NOTIFICATION
─────────────────────────────────────────────── */
notifTimer = setTimeout(function() {
  if (callActive) return;
  var now = new Date();
  document.getElementById('ntm').textContent =
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  document.getElementById('nb').classList.add('show');
  playNotifSound();
}, 10000);

/* ───────────────────────────────────────────────
   TRANSCRIPT OBSERVER
─────────────────────────────────────────────── */
function findBotBubble(node) {
  var el = (node.nodeType === 1) ? node : node.parentElement;
  while (el) {
    if (el.className && typeof el.className === 'string' &&
        el.className.indexOf('webrtc_transcript_bubble_bot') >= 0) return el;
    el = el.parentElement;
  }
  return null;
}

function onBotActivity(el) {
  var text = (el.textContent || '').trim();
  if (text === lastText || text === '') return;
  lastText = text;
  speaking = true;

  if (text.indexOf('!') !== -1) {
    targetE = 0.95; 
  } else if (text.indexOf('?') !== -1) {
    targetE = 0.55; 
  } else {
    targetE = 0.75;
  }

  var textLength = text.length;
  var dynamicDuration = Math.max(1500, textLength * 65);

  clearTimeout(speakTimer);
  speakTimer = setTimeout(function() {
    speaking = false; 
    targetE = 0; 
    lastText = '';
    sphereColorMode = 'default';
  }, dynamicDuration);
}

function startTranscriptObserver() {
  if (transcriptObs) return;
  transcriptObs = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      m.addedNodes.forEach(function(node) {
        if (node.nodeType !== 1) return;
        if (typeof node.className === 'string' &&
            node.className.indexOf('webrtc_transcript_bubble_bot') >= 0) {
          onBotActivity(node); return;
        }
        try {
          var inner = node.querySelector('[class*="webrtc_transcript_bubble_bot"]');
          if (inner) onBotActivity(inner);
        } catch(e) {}
      });
      if (m.type === 'characterData') {
        var bubble = findBotBubble(m.target);
        if (bubble) onBotActivity(bubble);
      }
    });
  });
  transcriptObs.observe(document.body, { childList: true, subtree: true, characterData: true });
}

/* ───────────────────────────────────────────────
   WIDGET INIT
─────────────────────────────────────────────── */
window.addEventListener('load', function() {
  if (!window.initWebRTCWidget) return;
  var snap = new Set(Array.from(document.body.querySelectorAll('*')));

  var btnObs = new MutationObserver(function() {
    if (cognigyBtn) return;
    var btns = document.querySelectorAll('button,[role="button"]');
    for (var i = 0; i < btns.length; i++) {
      var btn = btns[i];
      if (!snap.has(btn) && !document.getElementById('myShell').contains(btn)) {
        cognigyBtn = btn;
        btnObs.disconnect();
        var root = btn.parentElement;
        try {
          var r2 = btn.closest('[class*="widget"],[class*="webrtc"],[id*="widget"],[id*="webrtc"]');
          if (r2) root = r2;
        } catch(e) {}
        if (root && root !== document.body)
          document.getElementById('cognigy-prison').appendChild(root);
        break;
      }
    }
  });
  btnObs.observe(document.body, { childList: true, subtree: true });

  window.initWebRTCWidget(
    'https://endpoint-trial.cognigy.ai/2f324835155e6badd2654ab8cf7952cc903b99682afedfb44febb73535607b96'
  ).then(function(w) {
    widgetRef = w;
    w.on('newRTCSession', function(session) {
      document.getElementById('cst').textContent = 'Verbunden';
      startTranscriptObserver();

      session.on('newInfo', function(infoEvent) {
        try {
          var data = JSON.parse(infoEvent.request.body);
          
          if (data.action === 'approval_requested') sphereColorMode = 'warning';
          if (data.action === 'process_complete') sphereColorMode = 'success';

          var idx = scenes.findIndex(function(s) { return s.action === data.action; });
          if (idx !== -1) activateScene(idx);
        } catch(e) { console.warn('SIP INFO parse error:', e); }
      });

      session.on('ended', function() {
        document.getElementById('cst').textContent = 'Anruf beendet';
        if (transcriptObs) { transcriptObs.disconnect(); transcriptObs = null; }
        speaking = false; targetE = 0;
        setTimeout(endCall, 1500);
      });
    });
  }).catch(function(e) { console.error('[AVA]', e); });
});

/* ───────────────────────────────────────────────
   NOTIFICATION ACTIONS
─────────────────────────────────────────────── */
function decline() {
  clearTimeout(notifTimer);
  var b = document.getElementById('nb');
  b.style.transition = 'transform .4s ease,opacity .4s ease';
  b.style.transform = 'translateY(-160px)';
  b.style.opacity = '0';
  setTimeout(function() { b.classList.remove('show'); b.style.cssText = ''; }, 420);
}

function accept() {
  callActive = true;
  clearTimeout(notifTimer);
  unlockAudio();

  if (cognigyBtn) {
    var r = document.getElementById('btn-annehmen').getBoundingClientRect();
    cognigyBtn.style.cssText = 'position:fixed!important;top:' + r.top + 'px!important;left:' + r.left + 'px!important;width:' + r.width + 'px!important;height:' + r.height + 'px!important;opacity:0!important;z-index:9999!important;pointer-events:all!important;border:none!important;padding:0!important;margin:0!important;cursor:pointer!important;';
    document.body.appendChild(cognigyBtn);
    cognigyBtn.click();
    setTimeout(function() {
      cognigyBtn.style.cssText = '';
      document.getElementById('cognigy-prison').appendChild(cognigyBtn);
    }, 500);
  }

  decline();
  setTimeout(function() {
    document.getElementById('co').classList.add('active');
    document.getElementById('cst').textContent = 'Verbinden…';
    if (!sphereRunning) { sphereRunning = true; drawLoop(); }
  }, 450);
}

function endCall() {
  if (!callActive) return;
  callActive = false;
  document.getElementById('co').classList.remove('active');
  sphereRunning = false;
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  if (transcriptObs) { transcriptObs.disconnect(); transcriptObs = null; }
  speaking = false; targetE = 0; smoothE = 0;
  clearSceneTimers();
  
  document.getElementById('co-default').style.display = 'flex';
  document.getElementById('co-scene').classList.remove('active');
  document.getElementById('co-default').appendChild(sc);
  document.getElementById('overlayLayer').innerHTML = '';
  try { if (widgetRef && widgetRef.endCall) widgetRef.endCall(); } catch(e) {}
}

function toggleMute() {
  muted = !muted;
  ['muteIcon','muteIconScene'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.className = muted ? 'ti ti-microphone-off' : 'ti ti-microphone';
  });
  ['muteBtn','muteBtnScene'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.style.background = muted ? 'rgba(255,59,48,.5)' : 'rgba(255,255,255,.1)';
  });
  ['muteLabel','muteLabelScene'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.textContent = muted ? 'Ton an' : 'Stumm';
  });
}

function toggleSpeaker() {
  ['spkBtn','spkBtnScene'].forEach(function(id) {
    var b = document.getElementById(id);
    if (!b) return;
    var on = b.dataset.on === '1';
    b.dataset.on = on ? '0' : '1';
    b.style.background = on ? 'rgba(255,255,255,.1)' : 'rgba(255,255,255,.25)';
  });
}

/* ───────────────────────────────────────────────
   ORGANIC LIQUID BLOB RENDER
─────────────────────────────────────────────── */
function drawLoop() {
  if (!sphereRunning) return;
  animFrame = requestAnimationFrame(drawLoop);
  time += 0.016;
  var diff = targetE - smoothE;
  smoothE += diff * (diff > 0 ? 0.18 : 0.04);
  drawSphere(smoothE);
}

function drawSphere(E) {
  ctx2d.clearRect(0, 0, 210, 210);
  
  var c1, c2;
  if (sphereColorMode === 'success') {
    c1 = '#4fd68f'; c2 = '#0a5d34';
  } else if (sphereColorMode === 'warning') {
    c1 = '#f0a830'; c2 = '#8a4b08';
  } else {
    c1 = '#a288ff'; c2 = '#451DC7';
  }

  var idlePulse = Math.sin(time * 2) * 3;
  var baseR = 55 + idlePulse + (E * 25); 

  ctx2d.save();
  ctx2d.translate(CX, CY);
  
  ctx2d.shadowBlur = 40 + (E * 30);
  ctx2d.shadowColor = c1;

  ctx2d.globalCompositeOperation = 'screen';
  
  for (var j = 0; j < 3; j++) {
    ctx2d.save();
    ctx2d.rotate(time * (0.3 + j * 0.1)); 
    
    ctx2d.beginPath();
    var offset = j * (Math.PI * 2 / 3);
    
    for (var i = 0; i <= Math.PI * 2.1; i += 0.1) {
       var wave = Math.sin(i * (3 + j) + time * 4 + offset);
       var spike = wave * (6 + E * 22);
       
       var r = baseR + spike;
       var x = Math.cos(i) * r;
       var y = Math.sin(i) * r;
       
       if (i === 0) ctx2d.moveTo(x, y);
       else ctx2d.lineTo(x, y);
    }
    ctx2d.closePath();

    var grd = ctx2d.createLinearGradient(-baseR, -baseR, baseR, baseR);
    grd.addColorStop(0, c1);
    grd.addColorStop(1, c2);

    ctx2d.globalAlpha = 0.65;
    ctx2d.fillStyle = grd;
    ctx2d.fill();
    ctx2d.restore();
  }
  
  ctx2d.globalCompositeOperation = 'source-over';
  ctx2d.shadowBlur = 0;
  ctx2d.globalAlpha = E > 0.03 ? 0.4 + (E * 0.3) : 0.15;
  ctx2d.beginPath();
  ctx2d.arc(0, 0, baseR * 0.4, 0, Math.PI * 2);
  ctx2d.fillStyle = '#ffffff';
  ctx2d.fill();
  
  ctx2d.restore();
}
