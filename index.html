<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<title>AVA</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#000;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:2rem 0;}
.shell{width:375px;height:812px;background:#000;border-radius:52px;box-shadow:0 0 0 2px #3a3a3c,0 0 0 5px #1c1c1e,0 30px 80px rgba(0,0,0,.6);position:relative;overflow:hidden;flex-shrink:0;}
.screen{position:absolute;inset:0;border-radius:52px;overflow:hidden;display:flex;flex-direction:column;}
.wp{position:absolute;inset:0;background:url('iClarified-iOS27-Celosia-Color-LockScreen.jpeg') center/cover no-repeat;z-index:0;}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:34px;background:#000;border-radius:0 0 22px 22px;z-index:50;}
.sb{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 24px 4px;color:#fff;font-size:15px;font-weight:600;font-family:-apple-system,sans-serif;}
.sb-r{display:flex;align-items:center;gap:6px;}
.bars{display:flex;align-items:flex-end;gap:2px;}
.bar{width:3px;background:#fff;border-radius:1px;}
.hc{position:relative;z-index:5;flex:1;display:flex;flex-direction:column;padding:0 0 20px;}
.dw{text-align:center;padding:26px 0 10px;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;}
.dd{font-size:29px;font-weight:600;letter-spacing:.1px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3);margin-bottom:4px;}
.dn{font-size:108px;font-weight:600;line-height:1;letter-spacing:-2px;color:transparent;background-image:linear-gradient(135deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,.3) 10%,rgba(255,255,255,.08) 28%,rgba(255,255,255,.4) 52%,rgba(255,255,255,.1) 100%),url('iClarified-iOS27-Celosia-Color-LockScreen.jpeg');background-size:375px 814.75px,375px 814.75px;background-repeat:no-repeat;background-position:0 0,0 -104.375px;-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:0.6px rgba(255,255,255,.55);filter:brightness(1.8) saturate(1.5) contrast(1.15) blur(0.4px);text-shadow:0 3px 8px rgba(0,0,0,.45);}
.grid{display:grid;grid-template-columns:repeat(4,1fr);align-content:start;gap:18px 10px;padding:16px 22px;flex:1;}
.ai{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;}
.ic{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.al{font-size:11px;color:#fff;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.6);font-weight:400;font-family:-apple-system,sans-serif;}
.dock{background:rgba(255,255,255,.15);backdrop-filter:blur(20px);border-radius:26px;margin:0 16px;padding:12px 16px;display:flex;justify-content:space-around;align-items:center;}
.di{width:62px;height:62px;border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;}
.hi{width:134px;height:5px;background:rgba(255,255,255,.35);border-radius:3px;margin:8px auto 0;display:block;}

/* ── NOTIFICATION ── */
#nb{position:absolute;top:50px;left:16px;right:16px;z-index:200;border-radius:20px;background:rgba(28,28,30,.92);backdrop-filter:blur(30px);padding:14px 16px;transform:translateY(-160px);opacity:0;transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .55s ease;pointer-events:none;font-family:-apple-system,sans-serif;}
#nb.show{transform:translateY(0);opacity:1;pointer-events:all;}
.nt{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.nai{width:32px;height:32px;border-radius:8px;background:#451DC7;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nai i{font-size:17px;color:#fff;}
.nan{font-size:12px;color:rgba(255,255,255,.55);font-weight:500;letter-spacing:.3px;text-transform:uppercase;}
.ntm{font-size:12px;color:rgba(255,255,255,.4);margin-left:auto;}
.ntit{font-size:16px;font-weight:600;color:#fff;margin-bottom:3px;}
.nbod{font-size:14px;color:rgba(255,255,255,.7);line-height:1.4;}
.nact{display:flex;gap:8px;margin-top:12px;}
.nbtn{flex:1;padding:10px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:-apple-system,sans-serif;}
.bdec{background:rgba(255,255,255,.12);color:#fff;}
.bacc{background:#34c759;color:#fff;}

/* ── CALL OVERLAY ── */
#co{position:absolute;inset:0;z-index:300;background:#000;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:70px 30px 55px;border-radius:52px;font-family:-apple-system,sans-serif;}
#co.active{display:flex;}
.caller-name{font-size:28px;font-weight:300;color:#fff;letter-spacing:-.3px;margin-bottom:6px;text-align:center;}
.caller-status{font-size:15px;color:rgba(255,255,255,.5);text-align:center;}

/* ── SPHERE ── */
.sphere-wrap{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center;}
#sphere-canvas{border-radius:50%;display:block;}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.06);animation:ringPulse 3s ease-in-out infinite;}
.ring:nth-child(1){width:220px;height:220px;animation-delay:0s;}
.ring:nth-child(2){width:250px;height:250px;animation-delay:.5s;}
.ring:nth-child(3){width:280px;height:280px;animation-delay:1s;}
@keyframes ringPulse{0%,100%{opacity:.3;transform:scale(1);}50%{opacity:.08;transform:scale(1.03);}}

/* ── CALL ACTIONS ── */
.cac{display:flex;justify-content:space-around;width:100%;align-items:center;}
.cbw{text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;}
.cbi{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.cbi i{font-size:26px;color:#fff;}
.cbr{background:#ff3b30;}
.cbg{background:rgba(255,255,255,.15);}
.cbl{font-size:12px;color:rgba(255,255,255,.6);}

/* ── HIDDEN WIDGET CONTAINER ── 
   Positioned off-screen so the widget renders & we can click it,
   but the user never sees it */
#wc{
  position:fixed;
  top:-9999px;
  left:-9999px;
  width:1px;
  height:1px;
  overflow:hidden;
  opacity:0;
  pointer-events:none;
  z-index:-1;
}
</style>

<body>

<!-- Widget renders here — completely hidden off-screen -->
<div id="wc"></div>

<script>
// ── globals ──
let audioCtx = null, analyser = null, micSource = null;
let animFrame = null, muted = false;
let smoothedLevel = 0, spherePhase = 0;
let widgetInstance = null;
const canvas = document.getElementById('sphere-canvas');
const ctx2d   = canvas.getContext('2d');

// ── Clock / Date ──
function updateClock() {
  const n = new Date();
  const hh = String(n.getHours()).padStart(2,'0');
  const mm = String(n.getMinutes()).padStart(2,'0');
  document.getElementById('clk').textContent = hh+':'+mm;
  const tl = document.getElementById('timeLine');
  if(tl) tl.textContent = hh+':'+mm;
}
function updateDate() {
  const days   = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  const months = ['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sept.','Okt.','Nov.','Dez.'];
  const n = new Date();
  const dl = document.getElementById('dateLine');
  if(dl) dl.textContent = days[n.getDay()]+'. '+n.getDate()+'. '+months[n.getMonth()];
}
updateClock(); updateDate(); setInterval(updateClock, 30000);

// ── Audio context unlock ──
function unlockAudio() {
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
['click','touchstart','mousemove'].forEach(e =>
  document.addEventListener(e, unlockAudio, {once:true})
);

// ── iOS tri-tone notification sound ──
function playNotifSound() {
  try {
    unlockAudio();
    const ac = audioCtx;
    const notes = [
      {freq:1047,start:0,   dur:0.12},
      {freq:1319,start:0.14,dur:0.12},
      {freq:1568,start:0.28,dur:0.18},
      {freq:1047,start:0.55,dur:0.12},
      {freq:1319,start:0.69,dur:0.12},
      {freq:1568,start:0.83,dur:0.18},
    ];
    notes.forEach(({freq,start,dur}) => {
      const osc = ac.createOscillator(), gain = ac.createGain();
      osc.connect(gain); gain.connect(ac.destination);
      osc.type = 'sine';
      const t = ac.currentTime + start;
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.28, t+0.02);
      gain.gain.setValueAtTime(0.28, t+dur-0.04);
      gain.gain.linearRampToValueAtTime(0, t+dur);
      osc.start(t); osc.stop(t+dur+0.01);
    });
  } catch(e) { console.warn('Audio:', e); }
}

// ── Show notification after 10 s ──
setTimeout(() => {
  const n = new Date();
  document.getElementById('ntm').textContent =
    String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  document.getElementById('nb').classList.add('show');
  playNotifSound();
}, 10000);

// ── Dismiss banner ──
function decline() {
  const b = document.getElementById('nb');
  b.style.transition = 'transform .4s ease, opacity .4s ease';
  b.style.transform  = 'translateY(-160px)';
  b.style.opacity    = '0';
  setTimeout(() => {
    b.classList.remove('show');
    b.style.cssText = '';
  }, 420);
}

// ── Accept → show sphere → start WebRTC immediately ──
function accept() {
  decline();
  unlockAudio(); // must be inside user-gesture handler
  setTimeout(() => {
    document.getElementById('co').classList.add('active');
    startSphere();
    initRTC();
  }, 450);
}

// ── End call ──
function endCall() {
  document.getElementById('co').classList.remove('active');
  document.getElementById('cst').textContent = 'Verbinden…';
  if(animFrame)  { cancelAnimationFrame(animFrame); animFrame = null; }
  if(micSource)  { try { micSource.disconnect(); } catch(e){} micSource = null; }
  // hang up via widget if possible
  if(widgetInstance && widgetInstance.hangup) widgetInstance.hangup();
  if(widgetInstance && widgetInstance.endCall) widgetInstance.endCall();
}

function toggleMute() {
  muted = !muted;
  if(micSource) {
    micSource.disconnect();
    if(!muted && analyser) micSource.connect(analyser);
  }
  document.getElementById('muteIcon').className = muted ? 'ti ti-microphone-off' : 'ti ti-microphone';
  document.getElementById('muteBtn').style.background = muted
    ? 'rgba(255,59,48,.5)' : 'rgba(255,255,255,.15)';
  document.getElementById('muteLabel').textContent = muted ? 'Ton an' : 'Stumm';
}

function toggleSpeaker() {
  const btn = document.getElementById('spkBtn');
  const on  = btn.dataset.on === '1';
  btn.dataset.on = on ? '0' : '1';
  btn.style.background = on ? 'rgba(255,255,255,.15)' : 'rgba(255,255,255,.35)';
}

// ── Sphere renderer ──
function getAudioLevel() {
  if(!analyser) return 0;
  const d = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(d);
  let s = 0; for(let i=0;i<d.length;i++) s+=d[i];
  return s / d.length / 255;
}

function startSphere() {
  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({audio:true,video:false})
      .then(stream => {
        unlockAudio();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.8;
        micSource = audioCtx.createMediaStreamSource(stream);
        micSource.connect(analyser);
        renderSphere();
      })
      .catch(() => renderSphere());
  } else { renderSphere(); }
}

function renderSphere() {
  const W=180,H=180,cx=90,cy=90,R=72;
  let time=0;
  function frame() {
    animFrame = requestAnimationFrame(frame);
    time += 0.018; spherePhase += 0.012;
    const raw = getAudioLevel();
    smoothedLevel += (raw - smoothedLevel) * 0.12;
    const energy = smoothedLevel + 0.04*Math.sin(time*1.2) + 0.02;
    ctx2d.clearRect(0,0,W,H);
    // glow
    const gr = ctx2d.createRadialGradient(cx,cy,R*.3,cx,cy,R+10+energy*30);
    gr.addColorStop(0,`rgba(120,80,255,${0.18+energy*.3})`);
    gr.addColorStop(.5,`rgba(60,30,180,${0.10+energy*.15})`);
    gr.addColorStop(1,'rgba(0,0,0,0)');
    ctx2d.beginPath(); ctx2d.arc(cx,cy,R+10+energy*30,0,Math.PI*2);
    ctx2d.fillStyle=gr; ctx2d.fill();
    // base
    const bg = ctx2d.createRadialGradient(cx-20,cy-24,4,cx,cy,R);
    bg.addColorStop(0,`rgba(160,120,255,${.55+energy*.25})`);
    bg.addColorStop(.45,`rgba(70,40,200,${.70+energy*.15})`);
    bg.addColorStop(1,`rgba(10,5,60,.95)`);
    ctx2d.beginPath(); ctx2d.arc(cx,cy,R,0,Math.PI*2);
    ctx2d.fillStyle=bg; ctx2d.fill();
    // lines (clipped)
    ctx2d.save(); ctx2d.beginPath(); ctx2d.arc(cx,cy,R,0,Math.PI*2); ctx2d.clip();
    for(let i=0;i<28;i++){
      const lat=(i/28-.5)*Math.PI, ry=Math.cos(lat)*R, yOff=Math.sin(lat)*R;
      const warp=energy*18*Math.sin(lat*3+time*2.5+i*.4);
      ctx2d.beginPath();
      for(let s=0;s<=64;s++){
        const a=(s/64)*Math.PI*2;
        const ex=cx+Math.cos(a)*ry;
        const ey=cy+yOff+Math.sin(a)*2+Math.sin(a*3+time*1.8+i)*energy*8+warp*Math.sin(a);
        s===0?ctx2d.moveTo(ex,ey):ctx2d.lineTo(ex,ey);
      }
      ctx2d.closePath();
      ctx2d.strokeStyle=`rgba(180,140,255,${.08+energy*.22})`;
      ctx2d.lineWidth=.8; ctx2d.stroke();
    }
    for(let i=0;i<16;i++){
      const ang=(i/16)*Math.PI+spherePhase*.3;
      ctx2d.beginPath();
      for(let s=0;s<=48;s++){
        const lat=(s/48-.5)*Math.PI;
        const rr=R+energy*14*Math.sin(lat*2+time*2+i*.5);
        ctx2d.lineTo(cx+Math.cos(ang)*Math.cos(lat)*rr, cy+Math.sin(lat)*rr);
      }
      ctx2d.strokeStyle=`rgba(200,160,255,${.05+energy*.18})`;
      ctx2d.lineWidth=.7; ctx2d.stroke();
    }
    // core
    const cr=( 12+energy*28)*(1+.08*Math.sin(time*4));
    const cg=ctx2d.createRadialGradient(cx,cy,0,cx,cy,cr);
    cg.addColorStop(0,`rgba(240,220,255,${.6+energy*.4})`);
    cg.addColorStop(.5,`rgba(160,100,255,${.3+energy*.3})`);
    cg.addColorStop(1,'rgba(80,40,200,0)');
    ctx2d.beginPath(); ctx2d.arc(cx,cy,cr,0,Math.PI*2);
    ctx2d.fillStyle=cg; ctx2d.fill();
    ctx2d.restore();
    // specular
    const sg=ctx2d.createRadialGradient(cx-22,cy-26,2,cx-18,cy-20,R*.55);
    sg.addColorStop(0,'rgba(255,255,255,.30)'); sg.addColorStop(.5,'rgba(255,255,255,.06)'); sg.addColorStop(1,'rgba(255,255,255,0)');
    ctx2d.beginPath(); ctx2d.arc(cx,cy,R,0,Math.PI*2); ctx2d.fillStyle=sg; ctx2d.fill();
    // rim
    const rg=ctx2d.createRadialGradient(cx,cy,R*.75,cx,cy,R);
    rg.addColorStop(0,'rgba(120,80,255,0)');
    rg.addColorStop(.7,`rgba(140,100,255,${.06+energy*.12})`);
    rg.addColorStop(1,`rgba(180,130,255,${.18+energy*.22})`);
    ctx2d.beginPath(); ctx2d.arc(cx,cy,R,0,Math.PI*2); ctx2d.fillStyle=rg; ctx2d.fill();
  }
  frame();
}

// ══════════════════════════════════════════════════
// WebRTC — load widget off-screen, auto-click its
// call button so the call starts without user seeing
// the widget UI at all.
// ══════════════════════════════════════════════════
function initRTC() {
  const statusEl = document.getElementById('cst');
  statusEl.textContent = 'Verbinden…';

  // Load the Cognigy widget script
  const sc = document.createElement('script');
  sc.src = 'https://github.com/Cognigy/click-to-call-widget/releases/latest/download/webRTCWidget.js';

  sc.onload = () => {
    if(!window.initWebRTCWidget) {
      statusEl.textContent = 'Widget nicht gefunden';
      return;
    }

    window.initWebRTCWidget(
      'https://endpoint-trial.cognigy.ai/2f324835155e6badd2654ab8cf7952cc903b99682afedfb44febb73535607b96'
    ).then(widget => {
      widgetInstance = widget;

      // ── Auto-click strategy ──
      // The widget injects a button into #wc (which is hidden off-screen).
      // We poll until the button appears, then click it programmatically.
      // This fires within the same user-gesture chain (accept() → initRTC()),
      // so browsers allow microphone access.
      let attempts = 0;
      const MAX = 40; // 4 seconds max

      function tryAutoClick() {
        attempts++;

        // Strategy 1: widget exposes a direct method
        if(widget.startCall)  { widget.startCall();  onCallStarted(); return; }
        if(widget.call)       { widget.call();        onCallStarted(); return; }
        if(widget.connect)    { widget.connect();     onCallStarted(); return; }
        if(widget.initiateCall){ widget.initiateCall(); onCallStarted(); return; }

        // Strategy 2: find and click the button the widget rendered
        const wc = document.getElementById('wc');
        const btn = wc
          ? (wc.querySelector('button') ||
             wc.querySelector('[role="button"]') ||
             wc.querySelector('.call-button') ||
             wc.querySelector('[class*="call"]') ||
             wc.querySelector('[class*="start"]') ||
             wc.querySelector('[class*="btn"]'))
          : null;

        if(btn) { btn.click(); onCallStarted(); return; }

        // Strategy 3: check shadow DOM
        const all = document.querySelectorAll('*');
        for(const el of all) {
          if(el.shadowRoot) {
            const sb = el.shadowRoot.querySelector('button') ||
                       el.shadowRoot.querySelector('[role="button"]');
            if(sb) { sb.click(); onCallStarted(); return; }
          }
        }

        // Keep trying
        if(attempts < MAX) {
          setTimeout(tryAutoClick, 100);
        } else {
          statusEl.textContent = 'Bitte Mikrofon erlauben';
        }
      }

      // Give widget 200ms to render its DOM, then start clicking
      setTimeout(tryAutoClick, 200);

      // ── Listen for session events ──
      widget.on('newRTCSession', session => {
        onCallStarted();

        // Hook remote audio into sphere analyser
        session.on('addstream', e => {
          try {
            unlockAudio();
            if(!analyser) {
              analyser = audioCtx.createAnalyser();
              analyser.fftSize = 256;
              analyser.smoothingTimeConstant = 0.8;
            }
            const remote = audioCtx.createMediaStreamSource(e.stream);
            remote.connect(analyser);
          } catch(err) {}
        });

        session.on('newInfo', ev => {
          try { const d = JSON.parse(ev.request.body); console.log('AVA:', d); }
          catch(e) {}
        });

        session.on('ended', () => {
          statusEl.textContent = 'Anruf beendet';
          setTimeout(endCall, 1500);
        });
      });

    }).catch(err => {
      console.error('WebRTC init error:', err);
      statusEl.textContent = 'Verbindung fehlgeschlagen';
    });
  };

  sc.onerror = () => { statusEl.textContent = 'Script-Ladefehler'; };
  document.head.appendChild(sc);
}

function onCallStarted() {
  document.getElementById('cst').textContent = 'Verbunden';
}
</script>
</body>
</html>
