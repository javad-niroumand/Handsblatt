<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#000;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:2rem 0;position:relative;}
#cognigy-prison{position:fixed;top:0;left:-9999px;width:260px;height:200px;pointer-events:all;z-index:1;opacity:0;}
.shell{width:375px;height:812px;background:#000;border-radius:52px;box-shadow:0 0 0 2px #3a3a3c,0 0 0 5px #1c1c1e,0 30px 80px rgba(0,0,0,.6);position:relative;overflow:hidden;flex-shrink:0;z-index:10;}
.screen{position:absolute;inset:0;border-radius:52px;overflow:hidden;display:flex;flex-direction:column;}
.wp{position:absolute;inset:0;background:url('iClarified-iOS27-Celosia-Color-LockScreen.jpeg') center/cover no-repeat;z-index:0;}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:34px;background:#000;border-radius:0 0 22px 22px;z-index:50;}
.sb{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 24px 4px;color:#fff;font-size:15px;font-weight:600;font-family:-apple-system,sans-serif;}
.sb-r{display:flex;align-items:center;gap:6px;}
.bars-sb{display:flex;align-items:flex-end;gap:2px;}
.bar-sb{width:3px;background:#fff;border-radius:1px;}
.hc{position:relative;z-index:5;flex:1;display:flex;flex-direction:column;padding:0 0 20px;}
.dw{text-align:center;padding:26px 0 10px;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;}
.dd{font-size:29px;font-weight:600;letter-spacing:.1px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3);margin-bottom:4px;}
.dn{font-size:108px;font-weight:600;line-height:1;letter-spacing:-2px;color:transparent;
  background-image:linear-gradient(135deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,.3) 10%,rgba(255,255,255,.08) 28%,rgba(255,255,255,.4) 52%,rgba(255,255,255,.1) 100%),url('iClarified-iOS27-Celosia-Color-LockScreen.jpeg');
  background-size:375px 814.75px,375px 814.75px;background-repeat:no-repeat;background-position:0 0,0 -104.375px;
  -webkit-background-clip:text;background-clip:text;-webkit-text-stroke:0.6px rgba(255,255,255,.55);
  filter:brightness(1.8) saturate(1.5) contrast(1.15) blur(0.4px);text-shadow:0 3px 8px rgba(0,0,0,.45);}
.grid{display:grid;grid-template-columns:repeat(4,1fr);align-content:start;gap:18px 10px;padding:16px 22px;flex:1;}
.ai{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;}
.ic{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.al{font-size:11px;color:#fff;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.6);font-weight:400;font-family:-apple-system,sans-serif;}
.dock{background:rgba(255,255,255,.15);backdrop-filter:blur(20px);border-radius:26px;margin:0 16px;padding:12px 16px;display:flex;justify-content:space-around;align-items:center;}
.di{width:62px;height:62px;border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;}
.hi{width:134px;height:5px;background:rgba(255,255,255,.35);border-radius:3px;margin:8px auto 0;display:block;}
#nb{position:absolute;top:50px;left:16px;right:16px;z-index:200;border-radius:20px;background:rgba(28,28,30,.92);backdrop-filter:blur(30px);padding:14px 16px;transform:translateY(-160px);opacity:0;transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .55s ease;pointer-events:none;font-family:-apple-system,sans-serif;}
#nb.show{transform:translateY(0);opacity:1;pointer-events:all;}
.nt{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.nai{width:32px;height:32px;border-radius:8px;background:#451DC7;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nai i{font-size:17px;color:#fff;}
.nan{font-size:12px;color:rgba(255,255,255,.55);font-weight:500;letter-spacing:.3px;text-transform:uppercase;}
.ntm{font-size:12px;color:rgba(255,255,255,.4);margin-left:auto;}
.ntit{font-size:16px;font-weight:600;color:#fff;margin-bottom:3px;}
.nbod{font-size:14px;color:rgba(255,255,255,.7);line-height:1.4;}
.nact{display:flex;gap:8px;margin-top:12px;}
#btn-annehmen{flex:1;padding:10px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:-apple-system,sans-serif;background:#34c759;color:#fff;position:relative;z-index:5;}
#btn-ablehnen{flex:1;padding:10px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:-apple-system,sans-serif;background:rgba(255,255,255,.12);color:#fff;}
#co{position:absolute;inset:0;z-index:300;background:#000;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:70px 30px 55px;border-radius:52px;font-family:-apple-system,sans-serif;}
#co.active{display:flex;}
.caller-name{font-size:28px;font-weight:300;color:#fff;letter-spacing:-.3px;margin-bottom:4px;text-align:center;}
.caller-status{font-size:14px;color:rgba(255,255,255,.45);text-align:center;letter-spacing:.3px;}
#sphere-canvas{display:block;border-radius:50%;}
.cac{display:flex;justify-content:space-around;width:100%;align-items:center;}
.cbw{text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;}
.cbi{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.cbi:active{transform:scale(.92);}
.cbi i{font-size:26px;color:#fff;}
.cbr{background:#ff3b30;}
.cbg{background:rgba(255,255,255,.13);}
.cbl{font-size:12px;color:rgba(255,255,255,.55);}
</style>

<body>

<div class="shell" id="myShell">
  <div class="notch"></div>
  <div class="screen">

        <div class="ai"><div class="ic" style="overflow:hidden;"><img src="wavestone-logo-cropped.png" style="width:100%;height:100%;object-fit:cover;border-radius:14px;"></div><span class="al">Wavestone</span></div>

        <div class="ai"><div class="ic" style="overflow:hidden;"><img src="tiktok-rounded-square-icon.webp" style="width:100%;height:100%;object-fit:cover;border-radius:14px;"></div><span class="al">TikTok</span></div>

        <div class="di"><img src="Contacts_(iOS).png" style="width:100%;height:100%;object-fit:cover;border-radius:16px;"></div>
        <div class="di" style="background:#fff;"><img src="google-chrome-icon.webp" style="width:84%;height:84%;object-fit:contain;"></div>

    <div id="nb">
      <div class="nt">

      <canvas id="sphere-canvas" width="210" height="210"></canvas>
      <div class="cac">

          <div class="cbi cbg" id="muteBtn"><i class="ti ti-microphone" id="muteIcon"></i></div>
          <div class="cbl" id="muteLabel">Stumm</div>
        </div>

          <div class="cbi cbr"><i class="ti ti-phone-off"></i></div>

        </div>
        <div class="cbw" onclick="toggleSpeaker()">
          <div class="cbi cbg" id="spkBtn"><i class="ti ti-volume"></i></div>

<script src="https://github.com/Cognigy/click-to-call-widget/releases/latest/download/webRTCWidget.js"></script>
<script>
// ─────────────────────────────────────────────────
// GLOBALS
// ─────────────────────────────────────────────────
var audioCtx      = null;
var animFrame     = null;
var muted         = false;
var cognigyBtn    = null;
var widgetRef     = null;
var transcriptObs = null;
var sphereRunning = false;
var time          = 0;

// speech / energy state
var speaking      = false;
var targetE       = 0;      // 0..1 energy target
var smoothE       = 0;      // smoothed value the renderer uses
var speakTimer    = null;   // fires when text stops changing → end of message
var lastText      = '';     // last seen bubble text

// ── message-length params ──
// Set once when message is COMPLETE (text stops changing).
// During streaming we just speak at base energy; after the
// message is full we know its length and adjust the params.
var msgSpeed      = 1.0;   // time multiplier
var msgWarp       = 1.0;   // deformation scale  (1 = normal)
var msgGlow       = 0;     // extra glow radius
var msgLines      = 28;    // latitude line count

var sc  = document.getElementById('sphere-canvas');
var ctx = sc.getContext('2d');
var CX  = 105, CY = 105, R = 86;

// ─────────────────────────────────────────────────
// CLOCK
// ─────────────────────────────────────────────────
function updateClock(){
  var n=new Date(),h=String(n.getHours()).padStart(2,'0'),m=String(n.getMinutes()).padStart(2,'0');
  document.getElementById('clk').textContent=h+':'+m;
  var t=document.getElementById('timeLine');if(t)t.textContent=h+':'+m;
}
function updateDate(){
  var D=['So','Mo','Di','Mi','Do','Fr','Sa'],
      M=['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sept.','Okt.','Nov.','Dez.'],
      n=new Date(),d=document.getElementById('dateLine');
  if(d)d.textContent=D[n.getDay()]+'. '+n.getDate()+'. '+M[n.getMonth()];
}
updateClock();updateDate();setInterval(updateClock,30000);

// ─────────────────────────────────────────────────
// AUDIO — notification only
// ─────────────────────────────────────────────────
function unlockAudio(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
['click','touchstart','mousemove'].forEach(function(e){document.addEventListener(e,unlockAudio,{once:true});});

function playNotifSound(){
  try{
    unlockAudio();
    var notes=[{f:1047,s:0,d:.12},{f:1319,s:.14,d:.12},{f:1568,s:.28,d:.18},
               {f:1047,s:.55,d:.12},{f:1319,s:.69,d:.12},{f:1568,s:.83,d:.18}];
    for(var i=0;i<notes.length;i++){
      var n=notes[i],o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.connect(g);g.connect(audioCtx.destination);o.type='sine';
      var t=audioCtx.currentTime+n.s;
      o.frequency.setValueAtTime(n.f,t);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.28,t+.02);
      g.gain.setValueAtTime(.28,t+n.d-.04);g.gain.linearRampToValueAtTime(0,t+n.d);
      o.start(t);o.stop(t+n.d+.01);
    }
  }catch(e){}
}

setTimeout(function(){
  var n=new Date();
  document.getElementById('ntm').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  document.getElementById('nb').classList.add('show');
  playNotifSound();
},10000);

// ─────────────────────────────────────────────────
// MESSAGE-LENGTH EVALUATOR
// Called ONCE per message, only after text is stable
// ─────────────────────────────────────────────────
function evaluateLength(len){
  // Short  < 60 chars  — quick reply, calm sphere
  // Medium 60–150      — normal sentence, moderate energy
  // Long   > 150       — detailed answer, intense sphere
  if(len < 60){
    msgSpeed = 0.75;
    msgWarp  = 0.7;
    msgGlow  = 6;
    msgLines = 22;
    targetE  = 0.55;
  } else if(len < 150){
    msgSpeed = 1.2;
    msgWarp  = 1.2;
    msgGlow  = 16;
    msgLines = 28;
    targetE  = 0.75;
  } else {
    msgSpeed = 1.9;
    msgWarp  = 2.2;
    msgGlow  = 32;
    msgLines = 36;
    targetE  = 1.0;
  }
}

// ─────────────────────────────────────────────────
// TRANSCRIPT OBSERVER
// Exact class from your screenshot:
//   webrtc_transcript_bubble webrtc_transcript_bubble_bot
// ─────────────────────────────────────────────────
function findBotBubble(node){
  var el=(node.nodeType===1)?node:node.parentElement;
  while(el){
    if(el.className && typeof el.className==='string' &&
       el.className.indexOf('webrtc_transcript_bubble_bot')>=0) return el;
    el=el.parentElement;
  }
  return null;
}

function onBubbleChange(el){
  var text=(el.textContent||'').trim();
  if(text===lastText) return;
  lastText=text;

  // Mark as speaking immediately so sphere reacts during streaming
  if(!speaking){
    speaking=true;
    targetE=0.65;   // base streaming energy (will be refined on complete)
  }

  // Reset the completion timer every time text changes
  // When it fires the message is complete → evaluate length
  clearTimeout(speakTimer);
  speakTimer=setTimeout(function(){
    // Message is now complete — evaluate its final length
    var finalText=(el.textContent||'').trim();
    evaluateLength(finalText.length);
    console.log('[AVA] msg complete, len='+finalText.length+', speed='+msgSpeed+', warp='+msgWarp);

    // Keep speaking state alive a bit longer so sphere stays energised
    setTimeout(function(){
      speaking=false;
      targetE=0;
      lastText='';
      // Reset params for next message
      msgSpeed=1.0; msgWarp=1.0; msgGlow=0; msgLines=28;
    }, 1800);
  }, 800);  // 800ms silence = message done
}

function startTranscriptObserver(){
  if(transcriptObs) return;

  transcriptObs=new MutationObserver(function(mutations){
    for(var i=0;i<mutations.length;i++){
      var m=mutations[i];

      // New nodes added
      for(var j=0;j<m.addedNodes.length;j++){
        var node=m.addedNodes[j];
        if(node.nodeType!==1) continue;
        // Is it the bubble itself?
        if(typeof node.className==='string' &&
           node.className.indexOf('webrtc_transcript_bubble_bot')>=0){
          onBubbleChange(node);
          continue;
        }
        // Does it contain a bubble?
        try{
          var inner=node.querySelector('[class*="webrtc_transcript_bubble_bot"]');
          if(inner) onBubbleChange(inner);
        }catch(e){}
      }

      // Text streaming inside an existing bubble
      if(m.type==='characterData'){
        var bubble=findBotBubble(m.target);
        if(bubble) onBubbleChange(bubble);
      }
    }
  });

  transcriptObs.observe(document.body,{
    childList:true, subtree:true, characterData:true
  });
  console.log('[AVA] transcript observer on');
}

// ─────────────────────────────────────────────────
// WIDGET INIT
// ─────────────────────────────────────────────────
window.addEventListener('load',function(){
  if(!window.initWebRTCWidget) return;
  var snap=new Set(Array.from(document.body.querySelectorAll('*')));

  var btnObs=new MutationObserver(function(){
    if(cognigyBtn) return;
    var btns=document.querySelectorAll('button,[role="button"]');
    for(var i=0;i<btns.length;i++){
      var btn=btns[i];
      if(!snap.has(btn)&&!document.getElementById('myShell').contains(btn)){
        cognigyBtn=btn; btnObs.disconnect();
        var root=btn.parentElement;
        try{var r2=btn.closest('[class*="widget"],[class*="webrtc"],[id*="widget"],[id*="webrtc"]');if(r2)root=r2;}catch(e){}
        if(root&&root!==document.body) document.getElementById('cognigy-prison').appendChild(root);
        console.log('[AVA] button ready');
        break;
      }
    }
  });
  btnObs.observe(document.body,{childList:true,subtree:true});

  window.initWebRTCWidget(
    'https://endpoint-trial.cognigy.ai/2f324835155e6badd2654ab8cf7952cc903b99682afedfb44febb73535607b96'
  ).then(function(w){
    widgetRef=w;
    w.on('newRTCSession',function(session){
      document.getElementById('cst').textContent='Verbunden';
      startTranscriptObserver();
      session.on('ended',function(){
        document.getElementById('cst').textContent='Anruf beendet';
        if(transcriptObs){transcriptObs.disconnect();transcriptObs=null;}
        speaking=false; targetE=0;
        setTimeout(endCall,1500);
      });
    });
  }).catch(function(e){console.error('[AVA]',e);});
});

// ─────────────────────────────────────────────────
// UI ACTIONS
// ─────────────────────────────────────────────────
function decline(){
  var b=document.getElementById('nb');
  b.style.transition='transform .4s ease,opacity .4s ease';
  b.style.transform='translateY(-160px)'; b.style.opacity='0';
  setTimeout(function(){b.classList.remove('show');b.style.cssText='';},420);
}
function accept(){
  unlockAudio();
  if(cognigyBtn){
    var r=document.getElementById('btn-annehmen').getBoundingClientRect();
    cognigyBtn.style.cssText='position:fixed!important;top:'+r.top+'px!important;left:'+r.left+'px!important;width:'+r.width+'px!important;height:'+r.height+'px!important;opacity:0!important;z-index:9999!important;pointer-events:all!important;border:none!important;padding:0!important;margin:0!important;cursor:pointer!important;';
    document.body.appendChild(cognigyBtn);
    cognigyBtn.click();
    setTimeout(function(){
      cognigyBtn.style.cssText='';
      document.getElementById('cognigy-prison').appendChild(cognigyBtn);
    },500);
  }
  decline();
  setTimeout(function(){
    document.getElementById('co').classList.add('active');
    document.getElementById('cst').textContent='Verbinden…';
    if(!sphereRunning){sphereRunning=true;drawLoop();}
  },450);
}
function endCall(){
  document.getElementById('co').classList.remove('active');
  sphereRunning=false;
  if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;}
  if(transcriptObs){transcriptObs.disconnect();transcriptObs=null;}
  speaking=false; targetE=0; smoothE=0;
  msgSpeed=1; msgWarp=1; msgGlow=0; msgLines=28;
  try{if(widgetRef&&widgetRef.endCall)widgetRef.endCall();}catch(e){}
}
function toggleMute(){
  muted=!muted;
  document.getElementById('muteIcon').className=muted?'ti ti-microphone-off':'ti ti-microphone';
  document.getElementById('muteBtn').style.background=muted?'rgba(255,59,48,.5)':'rgba(255,255,255,.13)';
  document.getElementById('muteLabel').textContent=muted?'Ton an':'Stumm';
}
function toggleSpeaker(){
  var b=document.getElementById('spkBtn'),on=b.dataset.on==='1';
  b.dataset.on=on?'0':'1'; b.style.background=on?'rgba(255,255,255,.13)':'rgba(255,255,255,.3)';
}

// ─────────────────────────────────────────────────
// RENDER LOOP
// ─────────────────────────────────────────────────
function drawLoop(){
  if(!sphereRunning) return;
  animFrame=requestAnimationFrame(drawLoop);

  // Time advances at message-speed when speaking, slow crawl when idle
  time += 0.016 * (speaking ? msgSpeed : 0.4);

  // Smooth energy — fast attack, slow decay
  var diff=targetE-smoothE;
  smoothE += diff*(diff>0 ? 0.16 : 0.035);

  drawSphere(smoothE);
}

// ─────────────────────────────────────────────────
// SPHERE — warp and glow scale with msgWarp/msgGlow
// ─────────────────────────────────────────────────
function drawSphere(E){
  var W=msgWarp;   // deformation multiplier from message length
  ctx.clearRect(0,0,210,210);

  // outer glow — radius grows with message length
  if(E>0.03){
    var glowR=R+10+E*20+msgGlow*E;
    var gr=ctx.createRadialGradient(CX,CY,R*.35,CX,CY,glowR);
    gr.addColorStop(0,'rgba(80,190,255,'+(0.11+E*.28)+')');
    gr.addColorStop(.6,'rgba(40,100,220,'+(0.03+E*.07)+')');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();ctx.arc(CX,CY,glowR,0,Math.PI*2);
    ctx.fillStyle=gr;ctx.fill();
  }

  // base sphere
  var base=ctx.createRadialGradient(CX-26,CY-30,4,CX,CY,R);
  if(E>0.03){
    base.addColorStop(0,'rgba(100,215,255,'+(0.62+E*.24)+')');
    base.addColorStop(.45,'rgba(22,105,215,'+(0.74+E*.13)+')');
    base.addColorStop(1,'rgba(4,28,95,.97)');
  } else {
    base.addColorStop(0,'rgba(110,85,220,.50)');
    base.addColorStop(.45,'rgba(52,28,160,.70)');
    base.addColorStop(1,'rgba(6,3,44,.95)');
  }
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);
  ctx.fillStyle=base;ctx.fill();

  // clip grid
  ctx.save();
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.clip();

  // ── latitude lines ──
  // count comes from msgLines (22 short / 28 medium / 36 long)
  var LATS=msgLines;
  for(var i=0;i<LATS;i++){
    var lat=(i/LATS-.5)*Math.PI;
    var ry=Math.cos(lat)*R;
    var yOff=Math.sin(lat)*R;
    // deformation scaled by W
    var warp=E*W*26*Math.sin(lat*4+time*3+i*.38);

    ctx.beginPath();
    for(var s=0;s<=72;s++){
      var a=(s/72)*Math.PI*2;
      var ex=CX+Math.cos(a)*ry;
      var p=Math.sin(a*3+time*2.5+i*.5)*E*W*13;
      var ey=CY+yOff+p+warp*Math.sin(a);
      s===0?ctx.moveTo(ex,ey):ctx.lineTo(ex,ey);
    }
    ctx.closePath();
    var alp=E>0.03?0.05+E*W*0.28:0.025;
    ctx.strokeStyle=E>0.03?'rgba(80,215,255,'+alp+')':'rgba(140,115,240,'+alp+')';
    ctx.lineWidth=0.7+W*0.2;
    ctx.stroke();
  }

  // ── longitude lines ──
  var LONS=Math.round(14+W*4);
  for(var i=0;i<LONS;i++){
    var ang=(i/LONS)*Math.PI+time*0.06;
    ctx.beginPath();
    for(var s=0;s<=52;s++){
      var lat2=(s/52-.5)*Math.PI;
      var rr=R+E*W*20*Math.sin(lat2*3+time*2.8+i*.65)+E*3;
      ctx.lineTo(CX+Math.cos(ang)*Math.cos(lat2)*rr,CY+Math.sin(lat2)*rr);
    }
    var la=E>0.03?0.03+E*W*0.20:0.02;
    ctx.strokeStyle=E>0.03?'rgba(60,200,255,'+la+')':'rgba(175,145,255,'+la+')';
    ctx.lineWidth=0.6+W*0.15;
    ctx.stroke();
  }

  // ── plasma core ──
  var cR=(10+E*34*W)*(1+.12*Math.sin(time*5.5));
  var cg=ctx.createRadialGradient(CX,CY,0,CX,CY,cR);
  if(E>0.03){
    cg.addColorStop(0,'rgba(190,245,255,'+(0.68+E*.33)+')');
    cg.addColorStop(.5,'rgba(60,180,255,'+(0.28+E*.36)+')');
    cg.addColorStop(1,'rgba(20,80,200,0)');
  } else {
    cg.addColorStop(0,'rgba(200,190,255,.13)');
    cg.addColorStop(.5,'rgba(120,90,220,.05)');
    cg.addColorStop(1,'rgba(80,40,200,0)');
  }
  ctx.beginPath();ctx.arc(CX,CY,cR,0,Math.PI*2);ctx.fillStyle=cg;ctx.fill();

  ctx.restore();

  // specular
  var sp=ctx.createRadialGradient(CX-28,CY-32,2,CX-22,CY-24,R*.5);
  sp.addColorStop(0,'rgba(255,255,255,.30)');
  sp.addColorStop(.55,'rgba(255,255,255,.05)');
  sp.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.fillStyle=sp;ctx.fill();

  // rim
  var rim=ctx.createRadialGradient(CX,CY,R*.74,CX,CY,R);
  rim.addColorStop(0,'rgba(80,60,200,0)');
  rim.addColorStop(.68,E>0.03?'rgba(40,155,255,'+(0.07+E*.14)+')':'rgba(110,80,210,.04)');
  rim.addColorStop(1,  E>0.03?'rgba(55,195,255,'+(0.17+E*.27)+')':'rgba(150,110,240,.08)');
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.fillStyle=rim;ctx.fill();
}
</script>
